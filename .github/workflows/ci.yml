name: Public client checks
on:
  push:
  pull_request:
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:boundary
      - run: npm run check:skill
      - run: npm run check:package
      - name: Install the packed CLI in a clean directory
        run: |
          archive="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          npm install --prefix "$RUNNER_TEMP/cellapp-smoke" --ignore-scripts "$RUNNER_TEMP/$archive"
          node "$RUNNER_TEMP/cellapp-smoke/node_modules/@cellapp/cli/dist/packages/cli/src/main.js" --help
          cmp skills/cellapp-deploy/SKILL.md "$RUNNER_TEMP/cellapp-smoke/node_modules/@cellapp/cli/skills/cellapp-deploy/SKILL.md"
      - run: npx --yes skills@1.5.26 add . --list
